<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web App Simpel</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="container">
  <header>
    <h1> Web Application</h1>
    <nav class="tabs">
      <button class="tab active" onclick="showTab('registrasi')">Registrasi</button>
      <button class="tab" onclick="showTab('postal')">Kode Pos</button>
      <button class="tab" onclick="showTab('produk')">Produk</button>
    </nav>
  </header>

  <!-- TAB 1: REGISTRASI -->
  <section id="tab-registrasi" class="section" style="display:block;">
    <h2>Daftar Mahasiswa</h2>
    
    <form onsubmit="return false;" class="form-group">
      <div>
        <label>Nama Mahasiswa</label>
        <input type="text" id="nama" placeholder="Ketik nama...">
        <ul id="nama-list" class="autocomplete-list"></ul>
      </div>

      <div>
        <label>NRP (10 digit)</label>
        <input type="text" id="nrp" placeholder="Contoh: 505424XXXX">
      </div>

      <div>
        <label>Semester</label>
        <select id="semester">
          <option value="">-- Pilih Semester --</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
        </select>
      </div>

      <div>
        <label>Mata Kuliah</label>
        <input type="text" id="matkul" placeholder="Nama Mata Kuliah">
      </div>

      <div>
        <label>Dosen Pengampu</label>
        <input type="text" id="dosen-form" placeholder="Ketik nama dosen...">
        <ul id="dosen-list" class="autocomplete-list"></ul>
      </div>

      <div style="display:flex; gap:10px;">
        <button type="button" onclick="submitForm()" class="btn-primary">Daftar</button>
        <button type="button" onclick="clearAll()" class="btn-danger">Hapus Semua</button>
      </div>
    </form>

    <h3>Data Terdaftar (<span id="count">0</span>)</h3>
    <div style="overflow-x:auto;">
      <table class="table">
        <thead>
          <tr>
            <th>No</th>
            <th>Nama</th>
            <th>NRP</th>
            <th>Semester</th>
            <th>Mata Kuliah</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="student-table">
          <tr><td colspan="6" style="text-align:center; padding:20px; color:#999;">Belum ada mahasiswa</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- TAB 2: POSTAL CODE -->
  <section id="tab-postal" class="section">
    <h2>Cari Kode Pos</h2>
    
    <form onsubmit="return false;" class="form-group">
      <div>
        <label>Provinsi</label>
        <select id="provinsi" onchange="updateCity()">
          <option value="">-- Pilih Provinsi --</option>
        </select>
      </div>

      <div>
        <label>Kota</label>
        <select id="kota" onchange="updateDistrict()">
          <option value="">-- Pilih Kota --</option>
        </select>
      </div>

      <div>
        <label>Kecamatan (Opsional)</label>
        <select id="kecamatan" disabled>
          <option value="">-- Pilih Kecamatan --</option>
        </select>
      </div>

      <div style="display:flex; gap:10px;">
        <button type="button" onclick="searchPostal()" class="btn-primary">Cari</button>
        <button type="button" onclick="resetPostal()" class="btn-secondary">Reset</button>
      </div>
    </form>

    <div id="postal-result"></div>
    <div id="postal-table" style="margin-top:20px;"></div>
  </section>

  <!-- TAB 3: PRODUK -->
  <section id="tab-produk" class="section">
    <h2>Pilih Produk</h2>
    
    <form onsubmit="return false;" class="form-group">
      <div>
        <label>Jenis Produk</label>
        <select id="jenis" onchange="updateBrand()">
          <option value="">-- Pilih Jenis --</option>
        </select>
      </div>

      <div>
        <label>Merek</label>
        <select id="merek" onchange="updateSerie()">
          <option value="">-- Pilih Merek --</option>
        </select>
      </div>

      <div>
        <label>Seri</label>
        <select id="seri" onchange="showProducts()">
          <option value="">-- Pilih Seri --</option>
        </select>
      </div>
    </form>

    <div id="product-list"></div>
  </section>

</div>

<script src="./js/script.js"></script>

<!-- AUTOCOMPLETE LISTENERS -->
<script>
  document.getElementById('nama').addEventListener('input', function() {
    showFilteredList('nama', 'nama-list', mahasiswa);
  });
  document.getElementById('dosen-form').addEventListener('input', function() {
    showFilteredList('dosen-form', 'dosen-list', dosen);
  });
</script>

</body>
</html>
